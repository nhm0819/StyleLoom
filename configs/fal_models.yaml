# fal.ai endpoint specs.
#
# Model endpoints do NOT share a parameter schema. Verified against the official
# fal.ai model pages (July 2026):
#
#   * Seedance 2.0 takes `image_url`; Kling v3 takes `start_image_url`.
#   * `duration` is a STRING everywhere, but not the same string: Seedance and
#     Kling take a bare number ("4"), Veo 3.1 a suffixed enum ("6s") drawn from a
#     sparse set. Every i2v model has a floor (Seedance 4s, Kling 3s, Veo 3.1 4s)
#     well above a typical short-form shot length.
#   * Seedance sizes via a `resolution` enum; Flux 2 via an `image_size` object.
#
# That is why this file exists instead of one hardcoded payload. Adding a model
# is a data change, not a code change.
#
# `min_duration` is load-bearing: render.py requests the floor and trims the
# result down to the storyboard's shot length. Getting it wrong means paying for
# footage you discard, or a clip shorter than the cut it has to fill.
#
# `price_per_sec` is recorded so `styleloom models` can price a style before you
# spend anything. Rates move; the source and date are below and worth re-checking.
# Where a rate is not recorded it is left out rather than guessed.
#
# `capabilities` marks what an endpoint can do: `multi_prompt` accepts a list of
# {prompt, duration} shots in ONE generation, lowering the billed floor from the
# endpoint's minimum to 1s per cut. Not to zero -- the per-shot duration is an
# integer enum, so sub-second cuts are neither billable nor deliverable on that
# path. `max_shots_per_request` is the other half of the limit and binds
# independently of `max_shot_window_sec`.
#
# NAMING, because it is genuinely confusing, and because these strings get
# mistaken for URLs. They are fal ENDPOINT IDs: fal posts to
# https://fal.run/<endpoint-id> and the model page is
# https://fal.ai/models/<endpoint-id>. The slashes are fal's vendor/model/tier/task
# namespace. KlingAI's own Open Platform is a different service; its model names
# are not valid values here.
#
# `kling-video/v3/*` IS Kling 3.0 -- fal's own page for v3/pro is titled "Kling 3.0
# Pro". The separate `o3` family is Kling 3.0 Omni; fal states plainly that "Kling
# O3 (VIDEO 3.0 Omni) is the upgrade from O1", and positions O3 for reference-heavy
# workflows and V3 for prompt-driven cinematic generation. They are not aliases:
# o3 takes `image_url` (not `start_image_url`), adds `end_image_url`, and its
# image-to-video schema does NOT list `elements`. Switching to o3 would cost the
# creator-consistency path, so v3 stays -- note this is a capability decision, not
# a price one, since o3/standard is $0.084/s, the same as v3/standard. Kling 3.0's
# concurrency limit is shared across all v3 and o3 endpoints at 1 per user.
#
# CANDIDATES NOT ADDED HERE. Each needs its parameter names read off the model
# page first -- guessing them is exactly the failure this file exists to prevent:
#   * google/nano-banana-2         t2i, holds one person's identity across
#                                  generations without fine-tuning; the natural
#                                  upgrade for casting's creator portrait
#   * alibaba/happy-horse/i2v      native Korean lip-sync, $0.14/s @720p
#   * fal-ai/veo3.1/image-to-video the non-fast Veo 3.1 tier; only the `fast`
#                                  endpoint has been verified here
#   * fal-ai/flux-2/flash          $0.005/MP, 5x cheaper than flux/dev and the
#                                  cheapest keyframe path seen. Its endpoint ID
#                                  and size parameter have not been read off the
#                                  model page, and this file does not guess
#   * fal-ai/kling-video/v3/4k     same request shape as v3/pro per the schema.
#                                  $0.42/s regardless of audio -- 5x the default
#   * fal-ai/kling-video/o3/pro    start+end frame and multi_prompt, but no
#                                  `elements` on the i2v endpoint; the sibling
#                                  o3/pro/reference-to-video is where character
#                                  consistency lives on that family

pricing_source: >-
  fal.ai/learn/tools/best-image-to-video-apis-2026, retrieved 2026-07-26,
  Elo figures stated as of 2026-06-14.

text_to_image:
  fal-ai/flux/dev:
    # https://fal.ai/models/fal-ai/flux/dev
    # The default. FLUX.1 [dev], $0.025/MP, billed rounded up to the megapixel --
    # a 720x1280 keyframe is 0.92MP and therefore bills as 1.
    #
    # Cheaper than flux-2-flex and sufficient here: a keyframe is the i2v start
    # image, never a deliverable. Flex's advantages are typography and up to 10
    # reference images; this pipeline burns its text with ffmpeg and passes the
    # creator reference to Kling's `elements`, so it uses neither.
    size_mode: image_size_object
    output_key: images
    defaults: {}

  fal-ai/flux-2-flex:
    # https://fal.ai/models/fal-ai/flux-2-flex
    # FLUX.2 [flex], $0.06/MP. Worth the 2.4x when a keyframe has to carry legible
    # text, or when a real creator photo is passed as a reference image.
    size_mode: image_size_object
    output_key: images
    defaults:
      output_format: jpeg

image_to_video:
  bytedance/seedance-2.0/image-to-video:
    # https://fal.ai/models/bytedance/seedance-2.0/image-to-video
    # Highest output quality of the endpoints here (Elo 1194, rank 1) and the most
    # expensive by a wide margin. Native audio is included at no extra charge.
    price_per_sec: 0.3034      # 720p. 1080p is 0.682.
    quality_elo: 1194
    image_param: image_url
    duration_param: duration
    min_duration: 4
    max_duration: 15
    size_mode: resolution_enum
    resolution: 720p
    aspect_param: aspect_ratio
    output_key: video
    persona_mode: none
    defaults:
      generate_audio: false

  bytedance/seedance-2.0/fast/image-to-video:
    # Identical schema to the standard tier; 720p max. A cheaper tier exists but
    # fal's comparison guide does not publish its per-second rate, so no
    # price_per_sec is recorded here -- the estimator will say so rather than
    # invent a number.
    image_param: image_url
    duration_param: duration
    min_duration: 4
    max_duration: 15
    size_mode: resolution_enum
    resolution: 720p
    aspect_param: aspect_ratio
    output_key: video
    persona_mode: none
    defaults:
      generate_audio: false

  fal-ai/kling-video/v3/pro/image-to-video:
    # https://fal.ai/models/fal-ai/kling-video/v3/pro/image-to-video
    # The quality tier. Identical request shape and capabilities to v3/standard
    # below, at $0.112/s against $0.084/s -- Pro buys output quality, not anything
    # the pipeline depends on, so standard is the default and this is the upgrade.
    # Aspect ratio is inferred from the start image, so no aspect param. Default
    # concurrency is 1 per user -- see MAX_CONCURRENT_RENDERS.
    #
    # Both Kling tiers are preferred over the higher-scoring Seedance 2.0 because
    # of the two capabilities below, which this system's requirements depend on:
    #   elements     -- the only character-reference path here, so the cast
    #                   creator survives across cuts
    #   multi_prompt -- a list of {prompt, duration} shots in one generation, so
    #                   a 1.2s cut costs 1.2s instead of the 3s floor
    price_per_sec: 0.112       # audio off. 0.168 with audio, 0.196 with voice control.
    price_per_sec_audio: 0.168
    quality_elo: 1075
    capabilities: [multi_prompt, elements]
    multi_prompt_param: multi_prompt
    # VERIFIED against the model page's KlingV3MultiPromptElement type. The nested
    # per-shot `duration` is a string, and the earlier guess of "string" was right
    # -- but the guess missed the part that matters: it is an INTEGER enum, values
    # 1 through 15. "1.2" is not a member. Sub-second cuts are therefore not
    # expressible in a multi_prompt request at all; the shortest legal shot is 1s.
    # A style whose average cut is 0.76s cannot be reproduced on this path, which
    # is why per_shot remains the default. qc's cut_timing_drift measures what the
    # rounding costs.
    multi_prompt_duration_type: integer_string
    max_shot_window_sec: 15
    # 1-6 shots per request, and the total must not exceed max_shot_window_sec.
    # Windowing has to respect both or a request with 7+ cuts is rejected outright.
    max_shots_per_request: 6
    image_param: start_image_url
    duration_param: duration
    min_duration: 3
    max_duration: 15
    size_mode: none
    output_key: video
    persona_mode: kling_elements
    max_concurrency: 1
    defaults:
      generate_audio: false
      # Required alongside multi_prompt. "customize" keeps the cuts where the
      # storyboard put them; "intelligent" hands shot structure to the model,
      # which would make the reference's pacing unreproducible.
      shot_type: customize
      negative_prompt: "blur, distort, low quality, on-screen text, subtitles, watermark"

  fal-ai/veo3.1/fast/image-to-video:
    # https://fal.ai/models/fal-ai/veo3.1/fast/image-to-video/api
    # Google's current i2v generation, replacing the deprecated veo2 endpoint.
    #
    # `duration` is a NON-CONTIGUOUS enum: 4s, 6s, 8s. There is no 5s or 7s, so
    # clamping between a min and a max is not enough -- a 5s request has to snap
    # to a legal value. Hence duration_choices, which the payload builder rounds
    # UP into: buying 6s and trimming to 5s works, buying 4s for a 5s cut does not.
    #
    # Floor 4s with no multi_prompt means the same waste arithmetic as Seedance:
    # fine for a hero cut, expensive at short-form pacing. No `elements`, so the
    # cast creator is prompt tokens only and the provider warns.
    #
    # generate_audio defaults to TRUE upstream, unlike every other endpoint here.
    # Left off explicitly: captions are burned by ffmpeg and BGM is the caller's,
    # so model audio is unwanted noise that is also billed.
    #
    # No price_per_sec: fal's comparison guide does not publish a rate for the
    # fast tier, and the estimator says so rather than inventing one.
    image_param: image_url
    duration_param: duration
    duration_format: seconds_suffix
    duration_choices: [4, 6, 8]
    min_duration: 4
    max_duration: 8
    size_mode: none
    aspect_param: aspect_ratio
    output_key: video
    persona_mode: none
    defaults:
      generate_audio: false
      resolution: 720p

  fal-ai/kling-video/v3/standard/image-to-video:
    # https://fal.ai/models/fal-ai/kling-video/v3/standard/image-to-video
    # The default. Its request type (ImageToVideoV3StandardRequest) carries
    # multi_prompt, elements and shot_type exactly like Pro -- an earlier revision
    # of this file declined to claim them because they were unconfirmed. They are
    # now confirmed, so the capabilities are declared.
    #
    # The rate was also missing here, which meant `styleloom models` printed "rate
    # not recorded" for the cheapest endpoint in the file and the arithmetic that
    # picks a default could not be done. Read off the model page 2026-07-28.
    price_per_sec: 0.084       # audio off. 0.126 with audio, 0.154 with voice control.
    price_per_sec_audio: 0.126
    capabilities: [multi_prompt, elements]
    multi_prompt_param: multi_prompt
    multi_prompt_duration_type: integer_string
    max_shot_window_sec: 15
    max_shots_per_request: 6
    image_param: start_image_url
    duration_param: duration
    min_duration: 3
    max_duration: 15
    size_mode: none
    output_key: video
    persona_mode: kling_elements
    max_concurrency: 1
    defaults:
      generate_audio: false
      shot_type: customize
      negative_prompt: "blur, distort, low quality, on-screen text, subtitles, watermark"
