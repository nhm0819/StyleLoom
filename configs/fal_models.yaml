# fal.ai endpoint specs.
#
# Model endpoints do NOT share a parameter schema. Verified against the official
# fal.ai model pages (July 2026):
#
#   * Seedance 2.0 takes `image_url`; Kling v3 takes `start_image_url`.
#   * `duration` is a STRING everywhere, and every i2v model has a floor
#     (Seedance 4s, Kling 3s) well above a typical short-form shot length.
#   * Seedance sizes via a `resolution` enum; Flux 2 via an `image_size` object.
#
# That is why this file exists instead of one hardcoded payload. Adding a model
# is a data change, not a code change.
#
# `min_duration` is load-bearing: render.py requests the floor and trims the
# result down to the storyboard's shot length. Getting it wrong means paying for
# footage you discard, or a clip shorter than the cut it has to fill.
#
# `price_per_sec` is recorded so `styleloom models` can price a style before you
# spend anything. Rates move; the source and date are below and worth re-checking.
# Where a rate is not recorded it is left out rather than guessed.
#
# `capabilities` is what the provider does NOT yet use, but the cost estimator
# does: `multi_prompt` marks endpoints that accept a list of {prompt, duration}
# shots in ONE generation, which removes the per-shot duration floor entirely.
#
# CANDIDATES NOT ADDED HERE. Each needs its parameter names read off the model
# page first -- guessing them is exactly the failure this file exists to prevent:
#   * google/nano-banana-2         t2i, holds one person's identity across
#                                  generations without fine-tuning; the natural
#                                  upgrade for casting's creator portrait
#   * alibaba/happy-horse/i2v      native Korean lip-sync, $0.14/s @720p
#   * fal-ai/kling-video/o3/pro    start+end frame, also has multi_prompt

pricing_source: >-
  fal.ai/learn/tools/best-image-to-video-apis-2026, retrieved 2026-07-26,
  Elo figures stated as of 2026-06-14.

text_to_image:
  fal-ai/flux-2-flex:
    # https://fal.ai/models/fal-ai/flux-2-flex
    size_mode: image_size_object
    output_key: images
    defaults:
      output_format: jpeg

  fal-ai/flux/dev:
    # https://fal.ai/docs/documentation/model-apis/fal-cdn
    size_mode: image_size_object
    output_key: images
    defaults: {}

image_to_video:
  bytedance/seedance-2.0/image-to-video:
    # https://fal.ai/models/bytedance/seedance-2.0/image-to-video
    # Highest output quality of the endpoints here (Elo 1194, rank 1) and the most
    # expensive by a wide margin. Native audio is included at no extra charge.
    price_per_sec: 0.3034      # 720p. 1080p is 0.682.
    quality_elo: 1194
    image_param: image_url
    duration_param: duration
    min_duration: 4
    max_duration: 15
    size_mode: resolution_enum
    resolution: 720p
    aspect_param: aspect_ratio
    output_key: video
    persona_mode: none
    defaults:
      generate_audio: false

  bytedance/seedance-2.0/fast/image-to-video:
    # Identical schema to the standard tier; 720p max. A cheaper tier exists but
    # fal's comparison guide does not publish its per-second rate, so no
    # price_per_sec is recorded here -- the estimator will say so rather than
    # invent a number.
    image_param: image_url
    duration_param: duration
    min_duration: 4
    max_duration: 15
    size_mode: resolution_enum
    resolution: 720p
    aspect_param: aspect_ratio
    output_key: video
    persona_mode: none
    defaults:
      generate_audio: false

  fal-ai/kling-video/v3/pro/image-to-video:
    # https://fal.ai/models/fal-ai/kling-video/v3/pro/image-to-video
    # The default. Aspect ratio is inferred from the start image, so no aspect
    # param. Default concurrency is 1 per user -- see MAX_CONCURRENT_RENDERS.
    #
    # Chosen over the higher-scoring Seedance 2.0 because of the two capabilities
    # below, both of which this system's requirements depend on:
    #   elements     -- the only character-reference path here, so the cast
    #                   creator survives across cuts
    #   multi_prompt -- a list of {prompt, duration} shots in one generation, so
    #                   a 1.2s cut costs 1.2s instead of the 3s floor
    price_per_sec: 0.112       # audio off. 0.168 with audio, 0.196 with voice control.
    price_per_sec_audio: 0.168
    quality_elo: 1075
    capabilities: [multi_prompt, elements]
    multi_prompt_param: multi_prompt
    # UNVERIFIED. The top-level `duration` is a string on every fal endpoint, so
    # the nested per-shot duration is sent as a string for consistency. This was
    # inferred from the sibling parameter, not read off the model page, and a
    # wrong type here is the kind of thing fal ignores silently. If a multi_shot
    # request is rejected or comes back the wrong length, change this to `number`
    # first -- it is a one-line data change and the payload builder is unit-tested
    # against both.
    multi_prompt_duration_type: string
    max_shot_window_sec: 15
    image_param: start_image_url
    duration_param: duration
    min_duration: 3
    max_duration: 15
    size_mode: none
    output_key: video
    persona_mode: kling_elements
    max_concurrency: 1
    defaults:
      generate_audio: false
      negative_prompt: "blur, distort, low quality, on-screen text, subtitles, watermark"

  fal-ai/veo2/image-to-video:
    # https://fal.ai/models/fal-ai/veo2/image-to-video/api
    #
    # DEPRECATED UPSTREAM. As of 2026-07-28 the model page carries "This endpoint
    # is deprecated / This model is no longer supported". The spec below is read
    # off that page and is correct, but requests may fail. It is here because it
    # was asked for; `fal-ai/veo3.1/fast/image-to-video` is the live Google
    # endpoint and its parameter names need reading off its own page before it is
    # added -- see the CANDIDATES note at the top of this file.
    #
    # Three properties make this a poor default for short-form, all of them
    # visible in the numbers rather than a matter of taste:
    #   min_duration 5  the highest floor of any endpoint here. The ASMR style
    #                   averages 0.76s per cut, so per_shot mode would buy 5s and
    #                   discard 85% of it. Kling's 3s floor plus multi_prompt is
    #                   cheaper by a wide margin.
    #   no multi_prompt one generation per cut, so the floor cannot be amortised.
    #   persona none    no reference-image parameter, so casting's creator
    #                   portrait is dropped and the presenter re-rolls per cut.
    #                   The provider warns rather than failing silently.
    #
    # The input image must be 16:9 or 9:16 or it is cropped to fit. The 720x1280
    # keyframes this harness produces are 9:16, so no crop. Note the About section
    # of the same page claims 16:9 only; the schema field description is the newer
    # of the two and is what is recorded here.
    #
    # No price_per_sec: fal's comparison guide does not list a rate for this
    # endpoint, and guessing one would make the cost estimator lie.
    image_param: image_url
    duration_param: duration
    # Enum "5s" | "6s" | "7s" | "8s", not a bare number. See build_animate_payload.
    duration_format: seconds_suffix
    min_duration: 5
    max_duration: 8
    size_mode: none
    output_key: video
    persona_mode: none
    defaults: {}

  fal-ai/kling-video/v3/standard/image-to-video:
    # Cheaper Kling tier. multi_prompt is documented for the Pro endpoint; not
    # confirmed here, so it is not claimed.
    image_param: start_image_url
    duration_param: duration
    min_duration: 3
    max_duration: 15
    size_mode: none
    output_key: video
    persona_mode: kling_elements
    max_concurrency: 1
    defaults:
      generate_audio: false
      negative_prompt: "blur, distort, low quality, on-screen text, subtitles, watermark"
