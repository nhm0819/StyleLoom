# KlingAI Open Platform endpoint specs.
#
# Payload differences between models are data, not code: a wrong parameter name is
# accepted and ignored rather than rejected, so the request succeeds and the
# parameter does nothing. Adding a model is a change here, not to the provider.
#
# Keys select an entry here. Where the model name goes in the request depends on
# which API generation the entry speaks, and `api:` says which:
#
#   api: v3      the current API. The model is a URL segment and the body is
#                `contents`/`settings`/`options`:
#
#                    POST /image-to-video/kling-3.0
#                    {"contents": [...], "settings": {"duration": 10, ...}}
#
#   (no api key) the legacy API. One path per capability, model in the body:
#
#                    POST /v1/videos/text2video
#                    {"model_name": "kling-v3", "mode": "std", ...}
#
# `mode` (std | pro) is the quality tier and lives in Settings, not here. It is a
# request field on the legacy API and the `resolution` enum on v3.
#
# Three capabilities, three sections. `text_to_image` builds a first frame,
# `image_to_video` animates it, and `text_to_video` is the fallback for a run with
# no first frame. The keyframe stage is back after having been removed once -- see
# docs/KEYFRAME_SCOPE.md for what changed, which is that ONE anchor is now reused
# across every request instead of each cut rolling its own.
#
# Values marked `unverified` are floors and enums that could not be confirmed --
# kling.ai/document-api renders client-side, so only fragments that reached a
# search index were readable. Each is a one-line fix, not a code change.
#
# No price field. Official billing is credit-based per subscription tier with no
# published per-second rate, so `styleloom models` reports billed seconds instead.
# Per-second figures quoted elsewhere are resellers' contract rates.

pricing_source: >-
  none. Credit-based per subscription tier. Run a short generation and read the
  console to calibrate.

# api-beijing.klingai.com is the mainland account system -- a separate account,
# not a region of this one.
base_url: https://api-singapore.klingai.com

text_to_video:
  # The current API, verified against the Kling 3.0 text-to-video reference.
  #
  # Same three-object body as image-to-video and the same /tasks polling, with two
  # differences that are specific to having no input image:
  #
  #   * The prompt is a top-level `prompt` STRING, not a `contents` array. There is
  #     no image to type, so there is nothing for the array to hold.
  #   * `settings.aspect_ratio` exists here and only here. image-to-video reads the
  #     ratio off the start frame; this endpoint has nothing to read.
  kling-3.0:
    api: v3
    path: /text-to-video/kling-3.0
    task_path: /tasks
    output_type: video
    prompt_format: text
    aspect_ratio_choices: ["9:16", "16:9", "1:1"]   # verified: the enum is these three
    duration_param: duration
    min_duration: 3
    max_duration: 15
    max_shot_window_sec: 15
    max_shots_per_request: 6
    max_prompt_chars: 3072            # hard ceiling; 2500 is the recommendation
    max_shot_prompt_chars: 512
    multi_shot_syntax: semicolon_prompt
    capabilities: [semicolon_prompt]
    resolution_by_mode:
      std: 720p
      pro: 1080p
    settings_defaults:
      audio: "off"
    # There is no negative_prompt field on 3.0; the prompt itself "can include
    # positive and negative descriptions". Appended to single-cut prompts only --
    # see negative_clause on the image_to_video entry for why not to multi-shot ones.
    negative_clause: "Avoid any text overlay, subtitles, captions, watermark or logo."

  # --- legacy API (/v1/videos/...) ----------------------------------------- #
  kling-v3:
    # POST /v1/videos/text2video   verified
    path: /v1/videos/text2video
    # No start frame, so aspect_ratio must be sent: image2video reads it off the
    # input image, text2video has nothing to read.
    aspect_ratio_choices: ["9:16", "16:9", "1:1"]
    duration_param: duration
    duration_format: bare_string      # "5", not "5s"
    min_duration: 3                   # unverified. The 3-15s range comes from
                                      # vendor summaries rather than a schema;
                                      # older models are a strict 5|10 enum.
    max_duration: 15
    max_shot_window_sec: 15
    max_shots_per_request: 6          # verified: "up to 6 storyboards, minimum 1"
    max_prompt_chars: 2500            # top-level `prompt`, used by per_shot
    max_shot_prompt_chars: 512        # verified. Five times tighter than the
                                      # top-level field, which is why multi_shot
                                      # prompts are built to a budget.
    multi_shot_param: multi_shot      # "true"/"false" as strings
    shot_type: customize              # verified. `intelligence` lets the model cut
                                      # its own shots, defeating the point of
                                      # holding the reference's cut timing.
    multi_prompt_param: multi_prompt
    multi_prompt_duration_type: integer_string   # {"index":1,"duration":"2"}
    multi_prompt_indexed: true
    output_key: videos                # data.task_result.videos[].url
    capabilities: [multi_prompt]
    # Cross-cut identity comes from the multi-shot request itself: every cut in one
    # window is a single generation. Across windows it is not. Pinning one face
    # everywhere needs `element_list: [{element_id}]` plus `<<<element_1>>>`, whose
    # ids come from an Element Management endpoint not verified here.
    defaults:
      sound: "off"                    # captions are burned in by ffmpeg; audio is
                                      # billed extra for something discarded
      # One field per request, rather than 47 characters in each of six entries --
      # and a negative instruction in a positive prompt is the weaker way to give it.
      negative_prompt: "text overlay, subtitles, captions, watermark, logo"

  kling-v3-omni:
    # POST /v1/videos/omni-video/   verified. A different path, not a different
    # model_name on the same one.
    path: /v1/videos/omni-video/
    aspect_ratio_choices: ["9:16", "16:9", "1:1"]
    duration_param: duration
    duration_format: bare_string
    min_duration: 3
    max_duration: 15
    max_shot_window_sec: 15
    max_shots_per_request: 6
    max_prompt_chars: 2500
    max_shot_prompt_chars: 512
    multi_shot_param: multi_shot
    shot_type: customize
    multi_prompt_param: multi_prompt
    multi_prompt_duration_type: integer_string
    multi_prompt_indexed: true
    output_key: videos
    capabilities: [multi_prompt]
    defaults:
      sound: "off"
      negative_prompt: "text overlay, subtitles, captions, watermark, logo"

text_to_image:
  kling-v3:
    # POST /v1/images/generations   verified from the official curl example.
    path: /v1/images/generations
    # Same enum shape as video: a ratio, never a pixel size. Wider than the video
    # list because the image endpoint offers eight named ratios plus Auto.
    aspect_ratio_choices: ["9:16", "16:9", "1:1", "3:4", "4:3", "2:3", "3:2", "21:9"]
    max_prompt_chars: 2500
    # One reference image, sent as raw Base64 in a flat field. This is the
    # parameter that makes every window's first frame a descendant of one anchor
    # rather than an independent roll.
    #
    # No reference_token. There was a `<<<image_1>>>` prefix here, and this
    # endpoint documents no token addressing at all: the reference is the `image`
    # field, and strength is `image_fidelity`/`human_fidelity`, both of which are
    # kling-v1/v1-5 only. So the prefix was not addressing anything -- it was
    # twelve literal characters at the front of the prompt, where the model is
    # weighting most heavily.
    reference_param: image
    output_key: images                # data.task_result.images[].url
    defaults:
      # `n` is an int in the schema and the official example sends it unquoted.
      # It was "1" here; a quoted value is the kind of thing that is accepted and
      # ignored, and the default is 1 anyway, so this was invisible.
      n: 1
      # 1k is enough for a 720x1280 start frame. 2k/4k are available and cost more
      # for pixels the video endpoint discards when it reads the frame.
      resolution: "1k"

image_to_video:
  # The current API, verified against the Kling 3.0 image-to-video reference.
  #
  # It is not the legacy shape with extra fields -- it is a different request and a
  # different response, and every difference fails silently rather than loudly:
  #
  #   * The model is in the PATH (/image-to-video/kling-3.0), not in `model_name`.
  #   * The body is three objects -- `contents`, `settings`, `options`. A flat
  #     `prompt`/`image`/`duration` request is accepted and generates 5s of
  #     defaults, because every unknown key is ignored.
  #   * There is no `mode`; the quality tier is `settings.resolution`.
  #   * There is no `negative_prompt`; negatives go inside the prompt text.
  #   * There is no `multi_prompt` array and no `shot_type`. Multi-shot is the
  #     semicolon shot list written into the prompt itself -- see below.
  #   * The task is read from GET /tasks?task_ids=..., which answers with a LIST,
  #     and its terminal status is `succeeded`, not `succeed`.
  kling-3.0:
    api: v3
    path: /image-to-video/kling-3.0
    # One shared task endpoint for every 3.0 capability, not {create path}/{id}.
    task_path: /tasks
    # `outputs` is a typed list rather than task_result.<key>; the type selects.
    output_type: video
    # The prompt is a typed entry in `contents` rather than a top-level string --
    # unlike the 3.0 text-to-video endpoint, which has no array at all.
    prompt_format: contents
    # Deliberately absent from the request, unlike the text_to_video entries: with a
    # start frame the endpoint reads the ratio off the image, and `aspect_ratio` is
    # not a field on this endpoint at all. Sending one can only disagree with the
    # frame that was just uploaded.
    sends_aspect_ratio: false
    # `contents: [{type: first_frame, url: <base64|url>}]`. The type is what makes
    # it a start frame rather than an Element reference, and Base64 goes in raw --
    # a data:image/png;base64, prefix is a 400.
    first_frame_type: first_frame
    duration_param: duration          # inside `settings`, and an int not a string
    min_duration: 3                   # verified: duration is an enum, 3..15
    max_duration: 15
    max_shot_window_sec: 15           # one request is one video, so the window IS
                                      # the duration ceiling
    max_shots_per_request: 6          # verified: "1-6 shots supported"
    # Verified: the hard ceiling is 3072 and 2500 is the documented recommendation.
    # It has to be the hard ceiling here because the whole shot list shares this
    # one field: six entries at the 512-character limit is 3072+ characters, and
    # budgeting to 2500 would refuse a storyboard the endpoint accepts.
    max_prompt_chars: 3072
    max_shot_prompt_chars: 512        # verified: per-shot `words` limit
    # Multi-shot is prose, not an array:
    #
    #   "shot 1, 3, words; shot 2, 4, words;"
    #
    # n is the 1-based shot number, m its duration in whole seconds (each >= 1s,
    # and the sum MUST equal settings.duration). This is the only multi-shot form
    # the 3.0 API has -- `multi_prompt` was the legacy transport and is gone.
    multi_shot_syntax: semicolon_prompt
    capabilities: [semicolon_prompt, first_frame]
    # std/pro is not a request field on 3.0. It maps onto the resolution enum,
    # which is what the tier meant anyway: std renders 720p, pro 1080p. (4k is
    # available and costs more for pixels a 720x1280 timeline discards.)
    resolution_by_mode:
      std: 720p
      pro: 1080p
    settings_defaults:
      # `native` would generate audio to match the visuals. Captions are burned in
      # by ffmpeg and the reference set has no dialogue, so this is a surcharge for
      # something the output discards.
      audio: "off"
    # There is no negative_prompt field on this API. The prompt itself "can include
    # positive and negative descriptions", so the clause is appended to the prompt
    # text -- but on SINGLE-CUT requests only.
    #
    # Not on a semicolon shot list. The documented form is `shot n, m, words;` and
    # there is no documented place in it for a global clause: prose before the list
    # or after the final semicolon may parse as a malformed shot, which collapses
    # the whole storyboard to one long cut and still reports success. Multi-shot
    # relies on the start frame instead, which the keyframe stage generates with
    # "no text, no captions, no watermark" in its own prompt.
    negative_clause: "Avoid any text overlay, subtitles, captions, watermark or logo."

  # --- legacy API (/v1/videos/...) ----------------------------------------- #
  #
  # Kept because the legacy endpoints still exist and someone may be pinned to
  # them. They speak the flat request shape and the `succeed`/task_result response.
  kling-v3:
    # POST /v1/videos/image2video/   verified. A different path from text2video,
    # not the same path with an extra field.
    path: /v1/videos/image2video/
    # Flat field, raw Base64 with NO data:image/png;base64, prefix -- the prefix
    # is a 400, and it is the single easiest mistake to make here.
    first_frame_param: image
    first_frame_format: base64_string
    # Deliberately absent, unlike the text_to_video entries: with a start frame the
    # endpoint reads the ratio off the image. Sending one is at best redundant and
    # at worst a conflict with the frame that was just uploaded.
    sends_aspect_ratio: false
    duration_param: duration
    duration_format: bare_string
    min_duration: 3
    max_duration: 15
    max_shot_window_sec: 15
    max_shots_per_request: 6
    max_prompt_chars: 2500
    max_shot_prompt_chars: 512
    multi_shot_param: multi_shot
    shot_type: customize
    multi_prompt_param: multi_prompt
    multi_prompt_duration_type: integer_string
    multi_prompt_indexed: true
    multi_shot_syntax: multi_prompt
    output_key: videos
    capabilities: [multi_prompt, first_frame]
    defaults:
      sound: "off"
      negative_prompt: "text overlay, subtitles, captions, watermark, logo"

  kling-v3-omni:
    # POST /v1/videos/omni-video/   the same path the text_to_video entry uses.
    # Omni is one unified endpoint; what changes is which inputs are populated.
    path: /v1/videos/omni-video/
    # NOT a flat field. Omni takes a typed list, and the type is what distinguishes
    # a start frame from a style reference:
    #
    #   image_list: [{"type": "first_frame", "url": "<base64|url>", "id": "image_1"}]
    #
    # `type` is an enum of first_frame | last_frame | refer_image, and `id` is what
    # the prompt addresses as <<<image_1>>>. Putting a first frame in without the
    # type would make it a style reference -- accepted, billed, and not a start
    # frame, with nothing in the response saying so.
    first_frame_param: image_list
    first_frame_format: typed_list
    first_frame_type: first_frame
    first_frame_id: image_1
    first_frame_token: "<<<image_1>>>"
    sends_aspect_ratio: false
    duration_param: duration
    duration_format: bare_string
    min_duration: 3
    max_duration: 15
    max_shot_window_sec: 15
    max_shots_per_request: 6
    max_prompt_chars: 2500
    max_shot_prompt_chars: 512
    multi_shot_param: multi_shot
    shot_type: customize
    multi_prompt_param: multi_prompt
    multi_prompt_duration_type: integer_string
    multi_prompt_indexed: true
    # multi_prompt, not semicolon_prompt. Both appear in Kling's docs and they are
    # not equivalent:
    #
    #   multi_prompt      a JSON array of {index, prompt, duration}. This is what
    #                     the official curl examples for image2video and omni-video
    #                     both send, and it is what `shot_type: customize` reads.
    #   semicolon_prompt  "shot 1, 3, words; shot 2, 4, words;" written into the
    #                     single top-level `prompt` field. The Omni prompt guide
    #                     documents this form for hand-written prompts.
    #
    # The array is the verified transport, so it is the default. The semicolon form
    # is implemented (`format_semicolon_shots`) and selectable, but it is UNVERIFIED
    # in one specific way that matters: the schema says `prompt` is invalid once
    # `multi_shot` is true, and no official example shows the semicolon string
    # alongside those flags. Which combination the endpoint honours could not be
    # confirmed without spending credits, and a prompt that is parsed as prose
    # instead of a shot list produces one long shot and reports success.
    multi_shot_syntax: multi_prompt
    output_key: videos
    capabilities: [multi_prompt, first_frame, semicolon_prompt]
    defaults:
      sound: "off"
      negative_prompt: "text overlay, subtitles, captions, watermark, logo"

# Not added:
#
#   * kling-v3-0-turbo   Appears in third-party model lists as the fast v3 tier.
#                        No official request example was readable, and a wrong
#                        model_name is rejected rather than ignored.
#   * kling-o1, kling-v2-6, kling-v2-5-turbo
#                        Older generations on the same path. None carry the
#                        multi_shot storyboard this system's pacing depends on.
#   * Motion Control, Avatar, Effects
#                        Separate solution APIs with their own paths.
