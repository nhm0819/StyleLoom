# KlingAI Open Platform endpoint specs.
#
# WHY THIS FILE EXISTS, unchanged from the fal registry it replaces: the payload
# differences between models are data, not code. A hardcoded payload sends a wrong
# parameter name to every model except the one it was written against, and does it
# silently -- the request succeeds and the parameter is ignored. Adding a model is
# a data change here, not an edit to the provider.
#
# WHAT CHANGED with the move off fal. These are not URL path segments any more.
# The official API has one path per capability and selects the model in the body:
#
#     fal      POST https://fal.run/fal-ai/kling-video/v3/pro/image-to-video
#     official POST https://api-singapore.klingai.com/v1/videos/image2video
#              {"model_name": "kling-v3", "mode": "pro", ...}
#
# So the keys below are `model_name` values, the path is a field, and the quality
# tier moved from the endpoint id into `mode` (std | pro), which is a setting.
#
# Parameter names differ from fal's wrapper throughout and were read off
# kling.ai/document-api, not translated from the fal specs:
#
#     start frame   fal start_image_url    official image
#     end frame     fal end_image_url      official image_tail
#     audio         fal generate_audio     official sound: "on" | "off"
#     multi-shot    fal multi_prompt only  official multi_shot + shot_type + multi_prompt
#     shot entry    fal {prompt,duration}  official {index,prompt,duration}
#
# VERIFICATION STATUS. Everything marked `verified` below appears in a request
# example on kling.ai/document-api. Everything marked `unverified` is a floor or
# an enum this file could not confirm, because the documentation site renders
# client-side and returns an empty shell to a fetch -- only fragments that reached
# a search index were readable. Unverified values are set conservatively, and each
# one is a one-line fix rather than a code change.
#
# NOT RECORDED: price. The official platform bills credits against a subscription
# rather than dollars per second, so the `price_per_sec` field the fal registry
# carried has no honest equivalent here. `styleloom models` therefore reports
# billed seconds and the wasted share -- which is the provider-independent part of
# that arithmetic -- and omits a cost column rather than inventing a rate. The
# per-second figures quoted around the web ($0.075/s and similar) are resellers'
# bulk-contract rates, not the official ones.

pricing_source: >-
  none. Official billing is credit-based per subscription tier; per-second credit
  rates live in the Kling VIDEO 3.0 Model User Guide, which is not machine
  readable. Run a short generation and read the console to calibrate.

# api-singapore is the international endpoint. api-beijing.klingai.com serves the
# mainland account system; the two are separate accounts, not regions of one.
base_url: https://api-singapore.klingai.com

# Kling accepts a public URL or a raw Base64 string for any image input. Base64 is
# what this provider sends, because the alternative is standing up a CDN just to
# hand the API a file that was generated locally two seconds earlier.
#
# The docs are explicit that a Base64 image must NOT carry a `data:image/png;base64,`
# prefix -- only the raw string. Getting that wrong is a 400 with an unhelpful body.
image_input:
  encoding: base64_raw
  max_bytes: 10485760        # unverified: 10MB is the documented ceiling for older
                             # models and is assumed to still hold. A keyframe at
                             # 720x1280 JPEG is ~200KB, so this is not a live limit.

text_to_image:
  kling-v3:
    # POST /v1/images/generations   verified
    # Payload keys verified from the official example:
    #   model_name, prompt, image, element_list, resolution, n, aspect_ratio,
    #   external_task_id, callback_url
    path: /v1/images/generations
    # There is no width/height. Size is aspect_ratio plus a resolution enum, so
    # the provider converts settings.width/height into a ratio string.
    size_mode: aspect_ratio_enum
    resolution: 2k             # verified as a legal value. 1k/4k unverified.
    aspect_ratio_choices: ["9:16", "16:9", "1:1", "4:3", "3:4", "3:2", "2:3"]
    output_key: images         # task result carries data.task_result.images[].url
    defaults:
      n: "1"                   # string, matching the docs example's "9"

image_to_video:
  kling-v3:
    # POST /v1/videos/image2video   verified
    # The default. Kling 3.0 proper -- multi-shot storyboards, native audio,
    # 3-15s. `mode` selects the std/pro tier, which is where the price difference
    # lives now that it is not in the endpoint id.
    path: /v1/videos/image2video
    image_param: image
    end_image_param: image_tail
    duration_param: duration
    duration_format: bare_string      # "5", not "5s"
    min_duration: 3                   # unverified. The 3-15s range for v3 comes
                                      # from vendor summaries rather than a
                                      # schema; older models are a strict 5|10
                                      # enum, so this is the conservative read.
    max_duration: 15
    max_shot_window_sec: 15
    max_shots_per_request: 6          # verified: "up to 6 storyboards, minimum 1"
    multi_shot_param: multi_shot      # "true"/"false" as strings in the example
    shot_type: customize              # verified. `intelligence` lets the model cut
                                      # its own shots, which is the opposite of
                                      # what this system wants -- the whole point
                                      # is holding the reference's cut timing.
    multi_prompt_param: multi_prompt
    multi_prompt_duration_type: integer_string   # {"index":1,"duration":"2"}
    multi_prompt_indexed: true                   # entries carry a 1-based index
    output_key: videos                # data.task_result.videos[].url
    capabilities: [multi_prompt]
    # persona_mode is `none`, and that is a real regression against the fal path.
    #
    # fal accepted an inline `elements: [{frontal_image_url}]`, so a creator
    # reference was one field on the render request. The official API references
    # elements by id -- `element_list: [{element_id}]` plus `<<<element_1>>>` in
    # the prompt -- and the id comes from a separate Element Management endpoint
    # whose request schema this file could not verify.
    #
    # Declared `none` rather than guessed. A wrong guess here does not fail loudly:
    # the request succeeds, the element is ignored, and the creator silently
    # changes face between cuts -- which is the exact failure the harness exists to
    # prevent. Creator identity still carries through the keyframe, which is
    # generated from a prompt that describes the cast creator; it is the weaker
    # mechanism, not none at all.
    persona_mode: none
    defaults:
      sound: "off"                    # captions are burned in and the reference
                                      # set has no dialogue; audio is billed extra
      negative_prompt: ""

  kling-v3-omni:
    # POST /v1/videos/omni-video/   verified -- a different path, not a different
    # model_name on the same one. This is the trap the fal naming hid: on fal both
    # were `kling-video/{v3,o3}/...` under one call shape.
    path: /v1/videos/omni-video/
    image_param: image
    duration_param: duration
    duration_format: bare_string
    min_duration: 3
    max_duration: 15
    max_shot_window_sec: 15
    max_shots_per_request: 6
    multi_shot_param: multi_shot
    shot_type: customize
    multi_prompt_param: multi_prompt
    multi_prompt_duration_type: integer_string
    multi_prompt_indexed: true
    output_key: videos
    capabilities: [multi_prompt]
    # Same gap as v3, and Omni is where it hurts most: reference-driven generation
    # is the entire reason to choose this model, and the reference is an element id.
    persona_mode: none
    defaults:
      sound: "off"

# NOT ADDED, and why:
#
#   * kling-v3-0-turbo   Appears in third-party model lists as the fast v3 tier.
#                        No official request example was readable, and the exact
#                        model_name string is the one thing that cannot be guessed
#                        -- a wrong value is rejected, not silently ignored.
#   * kling-o1, kling-v2-6, kling-v2-5-turbo
#                        Older generations. They take the same image2video path,
#                        so adding one is a block here; none of them carry the
#                        multi_shot storyboard that this system's pacing depends on.
#   * Motion Control, Avatar, Effects
#                        Separate solution APIs with their own paths. Out of scope
#                        for a keyframe-then-motion pipeline.
