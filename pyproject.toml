# Workspace root. Not an installable package itself -- the two distributions live
# in agent-core/ and cli/.
#
# Why two distributions rather than one package with subfolders: "framework
# independent" is only enforceable as a dependency boundary. styleloom-core
# cannot import typer because typer is not in its dependency list, and that stays
# true as the project grows. Folder names alone would not stop it.
#
# When api/ and worker/ arrive they become members here too, each depending on
# styleloom-core and never on each other.

[tool.uv.workspace]
members = ["agent-core", "cli"]

[tool.uv.sources]
styleloom-core = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["agent-core/tests", "cli/tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 95
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042 wants StrEnum instead of (str, Enum). Declined: StrEnum changes what
# str(member) returns, and these enums are serialised by pydantic and read from
# JSON by transports. The current form is correct and the churn carries risk
# without benefit.
ignore = ["UP042"]
