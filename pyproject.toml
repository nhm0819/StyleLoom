[project]
name = "styleloom"
version = "0.1.0"
description = "Decompose a reference short-form video into a reusable style schema, then generate new videos in that style."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyflakes>=3.2"]
# Only needed for STYLELOOM_VIDEO_PROVIDER=fal. The default providers are offline.
fal = ["fal-client>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
