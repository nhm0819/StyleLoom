[project]
name = "styleloom-cli"
version = "0.2.0"
description = "CLI harness for StyleLoom."
requires-python = ">=3.11"
dependencies = [
    "styleloom-core",
    "typer>=0.12",
]

[project.scripts]
styleloom = "styleloom_cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["styleloom_cli*"]

[tool.uv.sources]
styleloom-core = { workspace = true }
